name: Deploy to Cloudflare Workers

# Runs on every push to main. This replaces relying on Cloudflare's
# Git-integrated "Workers Builds" (referenced in wrangler.jsonc's name
# comment) — that integration turned out not to be actually connected:
# real commits stopped showing up in the live Worker bundle, confirmed by
# checking the deployed code directly via the Cloudflare API. This
# workflow keeps the whole deploy path inside the repo instead, so it's
# never dependent on a dashboard setting no one can see from here.
on:
  push:
    branches: [main]
  # Lets you manually re-trigger a deploy from the Actions tab without an
  # empty commit, e.g. if a build fails for a transient reason.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Same safety gate as ci.yml — don't deploy code that doesn't even
      # typecheck. Redundant with CI on PRs, but pushes straight to main
      # (bypassing PR review) are the norm in this repo, so this is the
      # only gate that actually runs before those.
      - name: Type check
        run: npx tsc --noEmit

      # TEMP DIAGNOSTIC — will be removed once the deploy failure is
      # root-caused. Raw job logs aren't fetchable from the debugging
      # environment used to investigate this, so this reports (without ever
      # printing the actual values) which of the required secrets are
      # actually configured in this repo's Settings → Secrets, via
      # ::notice:: annotations that ARE readable through the Checks API.
      - name: "DIAGNOSTIC: check required secrets are set"
        run: |
          check() {
            if [ -z "$2" ]; then
              echo "::error::Secret $1 is EMPTY or not set in repo Settings → Secrets and variables → Actions"
            else
              echo "::notice::Secret $1 is set (length ${#2})"
            fi
          }
          check CLOUDFLARE_API_TOKEN "$CF_TOKEN"
          check NEXT_PUBLIC_SUPABASE_URL "$SUPA_URL"
          check NEXT_PUBLIC_SUPABASE_ANON_KEY "$SUPA_ANON"
          check SUPABASE_SERVICE_ROLE_KEY "$SUPA_SERVICE"
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPA_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPA_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPA_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build and deploy
        # package.json's "deploy" script: opennextjs-cloudflare build &&
        # opennextjs-cloudflare deploy. Wrangler (used under the hood)
        # picks up CLOUDFLARE_API_TOKEN from the environment automatically.
        #
        # The three Supabase env vars MUST be present at BUILD time: ten API
        # routes instantiate their Supabase clients at module scope, and
        # `next build` evaluates every route module while collecting page
        # data — with the vars absent, supabase-js throws
        # "supabaseUrl is required." and the whole build dies in seconds
        # (deploy runs #15-#18 all failed exactly this way). They are read
        # from GitHub Actions secrets here so CI builds match what
        # .env.local provides locally.
        #
        # Runtime values on the deployed Worker itself are separate: they
        # live in Cloudflare dashboard secrets and survive deploys via
        # keep_vars: true in wrangler.jsonc — this step only affects what
        # gets baked into the bundle during the build.
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Only needed if the token has access to more than one Cloudflare
          # account — wrangler infers it from the token otherwise. Uncomment
          # and add the CLOUDFLARE_ACCOUNT_ID secret if a deploy fails with
          # an "account ID could not be determined" style error.
          # CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
